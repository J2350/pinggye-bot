<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fernhollow</title>
<meta name="description" content="A regenerative design studio. Wander through a night valley of flowers that grows as you move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@400&family=Manrope:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ── 기본값: 단위(--u), 색 ── */
:root{--u:min(calc(100vw/1600),calc(100vh/900));--cream:#f5efe2;--vig-in:62}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#000;overflow:hidden}
body{color:var(--cream);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ── 3D 계곡이 그려지는 자리 ── */
#valley{position:fixed;inset:0}
.js-canvas-container{position:absolute;inset:0}
.js-canvas-container canvas{display:block;width:100%!important;height:100%!important}
.lil-gui{display:none!important}
/* 비네트: 빨리 움직일수록 가장자리가 어두워진다(--vig-in 값을 자바스크립트가 바꾼다) */
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse at center,transparent calc(var(--vig-in)*1%),rgba(0,0,0,.82) 100%)}
/* WebGL을 쓸 수 없을 때의 대체 배경 */
#valley.fallback{background:radial-gradient(ellipse at 50% 70%,#1a0f2e 0%,#07050f 55%,#000 100%)}

/* ── 화면 위의 인터페이스 ── */
.ui{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.6s ease}
.ui.on{opacity:1}
.ui a,.ui button{pointer-events:auto}
header{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(24*var(--u)) calc(44*var(--u)) 0}
.logo{font-size:calc(26*var(--u));font-weight:500;letter-spacing:-.02em}
nav{display:flex;align-items:center;gap:calc(44*var(--u));font-size:calc(14.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
nav a:not(.pill){transition:opacity .2s}nav a:not(.pill):hover{opacity:.6}
.pill{display:inline-flex;align-items:center;height:calc(46*var(--u));padding:0 calc(26*var(--u));border-radius:99px;background:var(--cream);color:#151510;transition:transform .25s}
.pill:hover{transform:translateY(-1px)}
.hero{position:absolute;left:0;right:0;top:50%;transform:translateY(-46%);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font:400 calc(158*var(--u))/.92 Antonio,"Arial Narrow",sans-serif;letter-spacing:-.012em;white-space:nowrap}
.cap{margin-top:calc(48*var(--u));font-size:calc(20*var(--u));line-height:1.3}
.go{display:grid;place-items:center;margin-top:calc(34*var(--u));width:calc(58*var(--u));height:calc(58*var(--u));border:1.5px solid var(--cream);border-radius:50%;transition:background .3s,color .3s}
.go:hover{background:var(--cream);color:#151510}
.go svg{width:calc(22*var(--u));height:calc(22*var(--u));fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.corner{position:absolute;right:calc(44*var(--u));bottom:calc(44*var(--u));display:flex;align-items:center;gap:calc(18*var(--u));font-size:calc(12.5*var(--u));font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.corner i{width:1px;height:calc(26*var(--u));background:rgba(245,239,226,.45)}
.sound{display:grid;place-items:center;width:calc(28*var(--u));height:calc(28*var(--u))}
.sound svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.sound .w{transition:opacity .3s}.sound[aria-pressed=false] .w{opacity:0}
.sound[aria-pressed=true] .x{opacity:0}

/* ── 로더: 검은 덮개 + 깜빡이는 점 하나 ── */
.loader{position:fixed;inset:0;z-index:3;display:grid;place-items:center;background:#000;transition:opacity 1s ease;pointer-events:none}
.loader.gone{opacity:0}
.loader span{width:calc(9*var(--u));height:calc(9*var(--u));min-width:6px;min-height:6px;border-radius:50%;background:var(--cream);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.4);opacity:.4}}
a:focus-visible,button:focus-visible{outline:2px solid var(--cream);outline-offset:3px}

/* ── 폰(820px 이하) ── */
@media (max-width:820px){
  :root{--u:1px}
  header{padding:18px 18px 0}
  nav a:not(.pill){display:none}
  .pill{height:40px;padding:0 18px;font-size:12px}
  .hero{left:20px;right:20px}
  .corner{left:20px;justify-content:center}
  h1{font-size:clamp(64px,19vw,96px);white-space:normal}
  .cap{font-size:17px}
  .corner{right:20px;bottom:30px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){.loader span{animation:none}}
</style>
</head>
<body>
<div id="valley" aria-hidden="true"><div class="js-canvas-container"></div></div>
<div class="vig" aria-hidden="true"></div>
<div class="ui" id="ui">
  <header>
    <a class="logo" href="#" aria-label="Fernhollow">Fernhollow</a>
    <nav aria-label="Main"><a href="#">Work</a><a href="#">About</a><a href="#">Journal</a><a class="pill" href="#">Let’s talk</a></nav>
  </header>
  <section class="hero">
    <h1>Grown, not built.</h1>
    <p class="cap">Rooted in nature.<br>Built for what’s next.</p>
    <a class="go" href="#" id="go" aria-label="See our work"><svg viewBox="0 0 24 24"><path d="M4 12h16M14 6l6 6-6 6"/></svg></a>
  </section>
  <div class="corner"><span>Scroll to wander</span><i></i>
    <button class="sound" id="sound" aria-pressed="false" aria-label="Ambient sound"><svg viewBox="0 0 24 24"><path d="M4 9.5v5h3.5L12 18V6L7.5 9.5Z"/><path class="w" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/><path class="x" d="m16 10 4 4m0-4-4 4"/></svg></button>
  </div>
</div>
<div class="loader" id="loader"><span></span></div>

<!-- three.js r154 (고정 버전). 계곡 장면은 아래 스크립트에서 직접 만든 것이다. -->
<script src="https://cdn.jsdelivr.net/npm/three@0.154.0/build/three.min.js"></script>
<script>
/*
 * Fernhollow — 밤 꽃 계곡 (직접 만든 간단한 버전)
 *
 * 이 파일의 3D 계곡은 gladeye.com의 엔진이 아니라, 같은 동작을 직접 새로 만든 것이다.
 * 원본 엔진(허락받은 사본)을 갖게 되면, 맨 아래 "시작하기" 부분의 `FlowerValley`와 `ambient`를
 * 원본의 `Valley`와 `audioStore()`로 바꿔 끼우면 된다. 두 쪽이 같은 모양(생성자 · startHoverTransition ·
 * stopHoverTransition · initAudio · toggleMute)으로 연결되도록 만들어 두었다.
 *
 * 구현한 동작
 *  - 꽃/잎 점 스프라이트: 꽃은 가까워질수록 피고, 잎은 멀리서부터 자라 들어온다
 *  - 카메라: 닫힌 곡선 길을 따라 날고, 휠·터치로 앞뒤로 움직이며, 가만히 있으면 천천히 앞으로 흐른다
 *  - 마우스: 화면에서 커서 주변의 점들을 밀어내고, 커서에 가까운 점은 더 빛나고, 카메라가 살짝 기운다
 *  - 효과: 거리 안개, 먼지 입자, 달빛 같은 빛기둥, 빠를수록 조여지는 비네트 (블룸·RGB 번짐은 넣지 않았다)
 *  - 키보드: 화살표·PageUp/PageDown·스페이스로도 움직일 수 있다
 *  - 세로 화면(폰): 시야를 넓히고 점 개수를 줄인다
 *  - 호버 전환: 비행이 멈추고, 꽃이 떠다니는 빛 입자로 흩어지고, 소리가 먹먹해진다
 *  - 소리: 파일 없이 Web Audio로 만든 잔잔한 소리. 처음엔 꺼져 있고 켜고 끌 때 서서히 변한다
 */
(function () {
  'use strict';

  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ───────────────────────── 소리 (Web Audio) ───────────────────────── */
  const ambient = {
    ctx: null, master: null, lowpass: null,
    muted: true,
    isInitialized: false,
    _timer: 0,

    // 원본의 initAudio()에 해당. 브라우저는 사용자가 누르기 전에는 소리를 낼 수 없어서,
    // 여기서는 준비 표시만 하고 실제 AudioContext는 처음 눌렀을 때 만든다.
    initAudio() { this.isInitialized = true; },

    _ensure() {
      if (this.ctx) return true;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return false;
      const ctx = (this.ctx = new AC());
      this.master = ctx.createGain();
      this.master.gain.value = 0; // 처음엔 꺼진 상태
      this.lowpass = ctx.createBiquadFilter();
      this.lowpass.type = 'lowpass';
      this.lowpass.frequency.value = 9000;
      this.master.connect(this.lowpass).connect(ctx.destination);

      // 낮은 울림 세 겹
      [[55, 'sine', 0.2], [82.41, 'triangle', 0.07], [110, 'sine', 0.05]].forEach(([freq, type, gain], i) => {
        const osc = ctx.createOscillator(); osc.type = type; osc.frequency.value = freq;
        const g = ctx.createGain(); g.gain.value = gain;
        const lfo = ctx.createOscillator(); lfo.frequency.value = 0.05 + i * 0.03;
        const lfoGain = ctx.createGain(); lfoGain.gain.value = gain * 0.4;
        lfo.connect(lfoGain).connect(g.gain);
        osc.connect(g).connect(this.master);
        osc.start(); lfo.start();
      });

      // 바람 소리: 갈색 잡음 → 대역 필터
      const len = ctx.sampleRate * 2;
      const buf = ctx.createBuffer(1, len, ctx.sampleRate);
      const data = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++) { last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02; data[i] = last * 3.5; }
      const noise = ctx.createBufferSource(); noise.buffer = buf; noise.loop = true;
      const band = ctx.createBiquadFilter(); band.type = 'bandpass'; band.frequency.value = 420; band.Q.value = 0.6;
      const windGain = ctx.createGain(); windGain.gain.value = 0.35;
      const windLfo = ctx.createOscillator(); windLfo.frequency.value = 0.07;
      const windLfoGain = ctx.createGain(); windLfoGain.gain.value = 180;
      windLfo.connect(windLfoGain).connect(band.frequency);
      noise.connect(band).connect(windGain).connect(this.master);
      noise.start(); windLfo.start();

      // 가끔 울리는 맑은 소리 (5음계)
      const notes = [1, 1.2, 1.335, 1.5, 1.78, 2, 2.4];
      const chime = () => {
        if (!this.muted && this.ctx.state === 'running') {
          const o = ctx.createOscillator(); o.type = 'sine';
          o.frequency.value = 220 * notes[Math.floor(Math.random() * notes.length)] * (Math.random() < 0.3 ? 2 : 1);
          const g = ctx.createGain(); const t = ctx.currentTime;
          g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.06, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0005, t + 3.2);
          o.connect(g).connect(this.master); o.start(t); o.stop(t + 3.4);
        }
        this._timer = setTimeout(chime, 2200 + Math.random() * 4200);
      };
      chime();
      return true;
    },

    // 켜기/끄기. 돌려주는 값이 true면 "꺼진 상태"다. (원본의 toggleMute와 같은 규칙)
    toggleMute() {
      if (!this._ensure()) return this.muted;
      this.muted = !this.muted;
      if (!this.muted && this.ctx.state === 'suspended') this.ctx.resume();
      this.master.gain.setTargetAtTime(this.muted ? 0 : 0.55, this.ctx.currentTime, 0.7); // 서서히
      return this.muted;
    },

    // 호버 전환 때 소리를 먹먹하게 만들었다가 되돌린다
    setMuffled(on) {
      if (this.lowpass) this.lowpass.frequency.setTargetAtTime(on ? 380 : 9000, this.ctx.currentTime, 0.45);
    }
  };

  /* ───────────────────────── 3D 계곡 ───────────────────────── */
  const VERT = `
    uniform float uTime, uScale, uDisperse, uPush, uFog, uIntro, uAspect;
    uniform vec2 uMouse;
    attribute vec3 aColor;
    attribute vec3 aDir;
    attribute vec2 aInfo;   // x: 크기, y: 위상(0~1)
    attribute float aKind;  // 0 꽃, 1 잎, 2 먼지
    varying vec3 vColor; varying float vKind; varying float vAlpha; varying float vGlow; varying float vPhase;
    void main() {
      float size = aInfo.x; float ph = aInfo.y;
      vec3 p = position;
      // 살랑거림
      if (aKind < 1.5) {
        p.x += sin(uTime*0.7 + ph*40.0 + p.x*0.15) * 0.06;
        p.z += cos(uTime*0.6 + ph*31.0) * 0.06;
        p.y += sin(uTime*0.9 + ph*53.0) * 0.04;
      } else {
        // 먼지: 천천히 떠다니고, 카메라 주변 상자 안에서 계속 되돌아온다
        p += vec3(sin(uTime*0.15+ph*20.0), cos(uTime*0.12+ph*13.0)*0.5, cos(uTime*0.17+ph*9.0)) * 2.0;
        p = cameraPosition + mod(p - cameraPosition + vec3(25.0), vec3(50.0)) - vec3(25.0);
      }
      // 호버 전환: 바깥·위쪽으로 흩어져 떠다니는 빛 입자가 된다
      float far = 2.0 + 7.0 * fract(ph * 7.31);
      vec3 drift = vec3(sin(uTime*0.5+ph*20.0), cos(uTime*0.4+ph*17.0)*0.7, cos(uTime*0.45+ph*13.0));
      p += (aDir * far + drift * 0.9) * uDisperse * (aKind < 1.5 ? 1.0 : 0.5);

      vec4 mv = modelViewMatrix * vec4(p, 1.0);
      float dist = max(-mv.z, 0.001);

      // 꽃은 가까워질수록 피고(작은 봉오리 → 활짝), 잎은 멀리서부터 자라 들어온다
      float grow = 1.0;
      if (aKind < 0.5) grow = mix(0.2, 1.0, 1.0 - smoothstep(10.0, 38.0, dist));
      else if (aKind < 1.5) grow = 1.0 - smoothstep(60.0, 110.0, dist);
      float sz = size * grow * mix(1.0, 0.4, uDisperse * step(aKind, 1.5));

      vec4 clip = projectionMatrix * mv;
      // 마우스: 화면 공간에서 커서로부터 밀어낸다. 가까울수록 세게.
      vec2 ndc = clip.xy / clip.w;
      vec2 diff = ndc - uMouse; diff.x *= uAspect;
      float len = length(diff);
      vec2 dir = len > 0.0001 ? diff / len : vec2(0.0);
      dir.x /= uAspect;
      clip.xy += dir * (uPush * exp(-len * 2.2)) * clip.w;
      gl_Position = clip;

      float near = 1.0 - smoothstep(0.0, 0.5, len);   // 커서 가까이일수록 1
      gl_PointSize = clamp(sz * uScale / dist * (1.0 + near * 0.6), 0.0, 240.0);
      float fog = exp(-pow(dist * uFog, 2.0));
      vAlpha = fog * smoothstep(0.8, 2.6, dist) * uIntro * step(0.0, clip.w);
      vGlow = (1.0 - smoothstep(0.0, 0.45, len)) + uDisperse * 0.35;
      vColor = aColor; vKind = aKind; vPhase = ph;
    }`;

  const FRAG = `
    varying vec3 vColor; varying float vKind; varying float vAlpha; varying float vGlow; varying float vPhase;
    void main() {
      vec2 uv = gl_PointCoord * 2.0 - 1.0;
      float r = length(uv);
      if (r > 1.0) discard;
      float a; vec3 col = vColor;
      if (vKind < 0.5) {            // 꽃: 다섯 장 꽃잎 + 밝은 중심
        float ang = atan(uv.y, uv.x) + vPhase * 6.2832;
        float petals = 0.58 + 0.42 * cos(ang * 5.0);
        float shape = 1.0 - smoothstep(petals - 0.25, petals, r * 1.15);
        float core = 1.0 - smoothstep(0.0, 0.3, r);
        a = shape * 0.8 + core * 0.9;
        col = mix(vColor, vec3(1.0, 0.95, 0.82), core * 0.85);
      } else if (vKind < 1.5) {     // 잎: 어둡고 부드러운 얼룩
        a = (1.0 - smoothstep(0.1, 1.0, r)) * 0.42;
      } else {                      // 먼지: 작은 빛점
        a = pow(1.0 - r, 2.0) * 0.9;
      }
      float glow = 1.0 + vGlow * 2.2;
      gl_FragColor = vec4(col * glow, clamp(a, 0.0, 1.0) * vAlpha);
    }`;

  // 같은 결과가 나오도록 고정된 난수 (모양이 매번 같다)
  function mulberry32(a) {
    return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  const ground = (x, z) => 0.9 * Math.sin(x * 0.05 + 1.3) * Math.cos(z * 0.045) + 0.5 * Math.sin(x * 0.11 + z * 0.08);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  class FlowerValley {
    /**
     * @param host        #valley 요소 (안에 .js-canvas-container가 있다)
     * @param onLoaded    장면이 처음 그려졌을 때 한 번
     * @param onIntroDone 도입 비행이 끝난 뒤 매 프레임 (부르는 쪽에서 한 번만 쓰도록 막는다)
     */
    constructor(host, onLoaded, onIntroDone) {
      this.host = host; this.onLoaded = onLoaded; this.onIntroDone = onIntroDone;
      this.disperse = 0; this.disperseTarget = 0;   // 흩어짐 정도 (0 ~ 1)
      this.speedMul = 1; this.speedTarget = 1;      // 비행 속도 배율
      try { this._init(); } catch (err) {
        console.warn('[Fernhollow] 3D 계곡을 시작하지 못했어요. 대체 배경을 보여 줍니다.', err);
        host.classList.add('fallback');
        setTimeout(onLoaded, 150); setTimeout(onIntroDone, 500);
      }
    }

    startHoverTransition() { this.speedTarget = 0; this.disperseTarget = 1; ambient.setMuffled(true); }
    stopHoverTransition()  { this.speedTarget = 1; this.disperseTarget = 0; ambient.setMuffled(false); }

    _init() {
      const THREE = window.THREE;
      const mount = this.host.querySelector('.js-canvas-container') || this.host;
      const renderer = this.renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setClearColor(0x03040a, 1);
      mount.appendChild(renderer.domElement);

      this.scene = new THREE.Scene();
      this.camera = new THREE.PerspectiveCamera(62, 1, 0.1, 400);

      // 카메라가 따라 날아갈 닫힌 곡선 길
      const pts = [];
      for (let i = 0; i < 14; i++) {
        const a = (i / 14) * Math.PI * 2;
        const R = 130 * (1 + 0.18 * Math.sin(3 * a + 0.5) + 0.12 * Math.cos(2 * a));
        const x = Math.cos(a) * R, z = Math.sin(a) * R;
        pts.push(new THREE.Vector3(x, ground(x, z) + 2.4, z));
      }
      this.curve = new THREE.CatmullRomCurve3(pts, true, 'centripetal');
      this.length = this.curve.getLength();

      this._buildFlowers();
      this._buildShafts();

      // 상태
      this.u = 0.02;                         // 길 위의 위치 (0 ~ 1)
      this.scroll = 0; this.scrollTarget = 0; // 휠·터치로 모은 이동량 (미터)
      this.mouse = { x: 0, y: 0, sx: 5, sy: 5 }; // sx, sy: 부드럽게 따라가는 값. 처음엔 화면 밖.
      this.speed = 0; this.vig = 62;
      this.time = 0; this.introStart = 0; this.loadedCalled = false;
      this.last = performance.now();
      this.INTRO_SEC = reduceMotion ? 1.5 : 4;
      this.DRIFT = reduceMotion ? 2 : 5;     // 가만히 있을 때 초당 몇 미터 흐르는지

      this._bind();
      this._resize();
      renderer.setAnimationLoop((now) => this._tick(now));
    }

    _buildFlowers() {
      const THREE = window.THREE;
      const rand = mulberry32(20240607);
      const gauss = () => (rand() + rand() + rand() + rand() - 2) * 1.7;
      const flowerPalette = [[1, .36, .6], [.72, .42, 1], [.3, .85, 1], [1, .8, .42], [.5, 1, .8], [1, .95, .86]];
      const leafPalette = [[.05, .36, .3], [.1, .46, .26], [.05, .26, .42], [.12, .32, .2]];
      // 작은 화면(폰)에서는 점 개수를 줄여 느려지지 않게 한다
      // (숨은 탭에서 열려 화면 크기를 읽지 못하면 0으로 나오므로, 그럴 때는 큰 화면으로 본다)
      const small = Math.min(innerWidth || 1280, innerHeight || 720) < 700;
      const N_FLOWER = small ? 10000 : 17000, N_LEAF = small ? 7000 : 12000, N_DUST = small ? 800 : 1300;
      const N = N_FLOWER + N_LEAF + N_DUST;
      const pos = new Float32Array(N * 3), col = new Float32Array(N * 3), dir = new Float32Array(N * 3);
      const info = new Float32Array(N * 2), kind = new Float32Array(N);

      const along = new THREE.Vector3(), side = new THREE.Vector3();
      const place = (i, k) => {
        const u = rand();
        const p = this.curve.getPointAt(u), tg = this.curve.getTangentAt(u);
        side.set(-tg.z, 0, tg.x).normalize();
        // 꽃의 45%는 길 가까이에 모아 카메라 앞이 휑하지 않게 한다
        const wide = k === 1 ? 12 : (rand() < 0.45 ? 3.5 : 8);
        let lateral = (rand() < 0.78 ? gauss() * wide : gauss() * 32);
        lateral += (lateral < 0 ? -0.35 : 0.35);          // 길 한가운데를 아주 살짝만 비운다 (꽃은 카메라보다 낮아서 부딪히지 않고, 세로 화면은 시야가 좁아 넓게 비우면 앞이 휑해진다)
        along.copy(tg).multiplyScalar((rand() - 0.5) * 3);
        const x = p.x + side.x * lateral + along.x, z = p.z + side.z * lateral + along.z;
        const lift = k === 0 ? 0.3 + rand() * 1.1 : 0.1 + rand() * 0.5;
        pos[i * 3] = x; pos[i * 3 + 1] = ground(x, z) + lift; pos[i * 3 + 2] = z;
      };
      const setDir = (i) => {
        const a = rand() * Math.PI * 2, e = rand() * 0.9 - 0.15;
        dir[i * 3] = Math.cos(a) * Math.cos(e); dir[i * 3 + 1] = Math.abs(Math.sin(e)) + 0.25; dir[i * 3 + 2] = Math.sin(a) * Math.cos(e);
      };
      for (let i = 0; i < N; i++) {
        setDir(i);
        info[i * 2 + 1] = rand();
        if (i < N_FLOWER) {
          place(i, 0); kind[i] = 0; info[i * 2] = 0.55 + rand() * 0.95;
          const c = flowerPalette[Math.floor(rand() * flowerPalette.length)];
          col.set(c, i * 3);
        } else if (i < N_FLOWER + N_LEAF) {
          place(i, 1); kind[i] = 1; info[i * 2] = 1.0 + rand() * 1.7;
          const c = leafPalette[Math.floor(rand() * leafPalette.length)];
          col.set(c, i * 3);
        } else {
          kind[i] = 2; info[i * 2] = 0.12 + rand() * 0.22;
          pos[i * 3] = (rand() - 0.5) * 50; pos[i * 3 + 1] = (rand() - 0.5) * 20; pos[i * 3 + 2] = (rand() - 0.5) * 50;
          col.set([1, .9, .75], i * 3);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('aColor', new THREE.BufferAttribute(col, 3));
      geo.setAttribute('aDir', new THREE.BufferAttribute(dir, 3));
      geo.setAttribute('aInfo', new THREE.BufferAttribute(info, 2));
      geo.setAttribute('aKind', new THREE.BufferAttribute(kind, 1));
      const u = this.uniforms = {
        uTime: { value: 0 }, uScale: { value: 150 }, uDisperse: { value: 0 }, uPush: { value: 0.07 },
        uFog: { value: 0.012 }, uIntro: { value: 0 }, uAspect: { value: 1 }, uMouse: { value: new THREE.Vector2(5, 5) }
      };
      const mat = new THREE.ShaderMaterial({
        uniforms: u, vertexShader: VERT, fragmentShader: FRAG,
        transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending
      });
      const points = new THREE.Points(geo, mat);
      points.frustumCulled = false;
      this.scene.add(points);
    }

    // 달빛 같은 빛기둥(light ray): 길 옆에 세워 둔 아주 은은한 세로 빛줄기. 카메라 쪽을 향해 돌고, 너무 가깝거나 멀면 사라진다.
    _buildShafts() {
      const THREE = window.THREE;
      const rand = mulberry32(777);
      this.shafts = [];
      const COUNT = 10;
      for (let i = 0; i < COUNT; i++) {
        const mat = new THREE.ShaderMaterial({
          transparent: true, depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
          uniforms: { uTime: this.uniforms.uTime, uIntro: this.uniforms.uIntro, uStrength: { value: 0 } },
          vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
          fragmentShader: `
            uniform float uTime, uIntro, uStrength; varying vec2 vUv;
            void main(){
              float edge = pow(1.0 - abs(vUv.x * 2.0 - 1.0), 2.6);                       // 가운데가 밝고 가장자리는 투명
              float vert = smoothstep(0.0, 0.3, vUv.y) * (1.0 - smoothstep(0.55, 1.0, vUv.y)); // 위아래 끝은 흐리게
              float flick = 0.85 + 0.15 * sin(uTime * 0.4 + vUv.y * 3.0 + uStrength * 7.0);
              gl_FragColor = vec4(vec3(0.55, 0.7, 1.0) * edge * vert * flick, edge * vert * 0.11 * uIntro * uStrength);
            }`
        });
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
        const u = (i + 0.3 + rand() * 0.4) / COUNT;
        const p = this.curve.getPointAt(u), tg = this.curve.getTangentAt(u);
        const lateral = (i % 2 ? 1 : -1) * (7 + rand() * 12);
        const x = p.x - tg.z * lateral, z = p.z + tg.x * lateral;
        const h = 50 + rand() * 20;
        mesh.scale.set(5 + rand() * 6, h, 1);
        mesh.position.set(x, ground(x, z) + h * 0.42, z);
        mesh.frustumCulled = false;
        this.scene.add(mesh);
        this.shafts.push(mesh);
      }
    }

    _updateShafts() {
      const cam = this.camera.position;
      const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
      for (const m of this.shafts) {
        const dx = cam.x - m.position.x, dz = cam.z - m.position.z;
        m.rotation.y = Math.atan2(dx, dz);                       // 카메라 쪽을 향하게
        const d = Math.hypot(dx, dz);
        m.material.uniforms.uStrength.value = smooth(10, 28, d) * (1 - smooth(70, 150, d)); // 가깝거나 멀면 사라짐
      }
    }

    _bind() {
      this._onResize = () => this._resize();
      window.addEventListener('resize', this._onResize);
      // 마우스: 화면 좌표를 -1 ~ 1로 바꿔 둔다
      window.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'touch') return;
        this.mouse.x = (e.clientX / innerWidth) * 2 - 1;
        this.mouse.y = -((e.clientY / innerHeight) * 2 - 1);
      }, { passive: true });
      document.addEventListener('pointerleave', () => { this.mouse.x = 9; this.mouse.y = 9; });
      // 휠: 한 칸(약 100) = 약 35미터
      window.addEventListener('wheel', (e) => { this.scrollTarget += e.deltaY * 0.35; }, { passive: true });
      // 터치: 손가락을 위로 밀면 앞으로. 휠보다 배율을 키워서 같은 느낌이 나게 한다.
      let ty = null;
      window.addEventListener('touchstart', (e) => { ty = e.touches[0].clientY; }, { passive: true });
      window.addEventListener('touchmove', (e) => {
        if (ty === null) return;
        const y = e.touches[0].clientY; this.scrollTarget += (ty - y) * 0.35 * 1.6; ty = y;
      }, { passive: true });
      window.addEventListener('touchend', () => { ty = null; }, { passive: true });
      // 키보드: 화살표·PageUp/PageDown·스페이스로도 "Scroll to wander" 할 수 있게 한다
      const KEY_STEP = { ArrowDown: 40, ArrowUp: -40, PageDown: 140, PageUp: -140, ' ': 140 };
      window.addEventListener('keydown', (e) => {
        const step = KEY_STEP[e.key];
        if (step === undefined || e.altKey || e.ctrlKey || e.metaKey) return;
        const tag = e.target && e.target.tagName;
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        if (e.key === ' ' && (tag === 'BUTTON' || tag === 'A')) return;   // 버튼·링크에서 스페이스는 원래 동작을 유지
        this.scrollTarget += step;
        if (e.key === ' ') e.preventDefault();
      });
      // 탭을 다녀오면 시간이 한꺼번에 흐르지 않게 기준 시각을 다시 잡는다
      document.addEventListener('visibilitychange', () => { this.last = performance.now(); });
    }

    // 화면 크기·배율이 지금 맞춰 둔 값과 다른지 확인하는 열쇠. 창 크기 이벤트를 놓치거나(숨은 탭 등) 배율이 바뀐 경우를 잡는다.
    _sizeKey() {
      return `${this.host.clientWidth}x${this.host.clientHeight}@${Math.min(window.devicePixelRatio || 1, 2)}`;
    }

    _resize() {
      this._appliedKey = this._sizeKey();
      const w = this.host.clientWidth || innerWidth, h = this.host.clientHeight || innerHeight;
      // 화면 배율(DPR)은 창을 옮기거나 확대하면 바뀔 수 있으니 크기를 맞출 때마다 다시 읽는다
      this.renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      this.renderer.setSize(w, h, false);
      // 세로 화면(폰)에서는 시야를 넓히고 시선을 더 아래로 두어, 꽃밭이 화면 아래쪽까지 채우게 한다
      const portrait = w < h;
      this.camera.fov = portrait ? 74 : 62;
      this.lookDown = portrait ? 4 : 3.2;
      this.camera.aspect = w / h; this.camera.updateProjectionMatrix();
      this.uniforms.uAspect.value = w / h;
      this.uniforms.uScale.value = (h * this.renderer.getPixelRatio() / 900) * 150; // 화면 크기와 상관없이 같은 비율로 보이게
    }

    _tick(now) {
      const THREE = window.THREE;
      const dt = Math.min((now - this.last) / 1000, 0.05); this.last = now;
      this.time += dt;
      const k = (rate) => Math.min(1, dt * rate);

      // 속도·흩어짐을 목표값으로 부드럽게 (호버 전환)
      this.speedMul += (this.speedTarget - this.speedMul) * k(2.2);
      this.disperse += (this.disperseTarget - this.disperse) * k(1.6);

      // 도입 비행: 높은 곳에서 내려오며 꽃들이 서서히 나타난다
      if (!this.introStart) this.introStart = this.time;
      const introT = clamp((this.time - this.introStart) / this.INTRO_SEC, 0, 1);
      const intro = 1 - Math.pow(1 - introT, 3);

      // 길 위의 이동: 가만히 있어도 흐르고, 휠·터치로 모은 이동량도 더한다
      const ds = (this.scrollTarget - this.scroll) * k(5);
      this.scroll += ds;
      const step = (this.DRIFT * dt * this.speedMul + ds * this.speedMul) / this.length;
      this.u = ((this.u + step) % 1 + 1) % 1;
      const mps = Math.abs(step) * this.length / Math.max(dt, 0.0001);  // 초당 이동 미터
      this.speed += (mps - this.speed) * k(4);

      // 마우스는 부드럽게 따라간다
      this.mouse.sx += (this.mouse.x - this.mouse.sx) * k(6);
      this.mouse.sy += (this.mouse.y - this.mouse.sy) * k(6);

      // 카메라
      const p = this.curve.getPointAt(this.u);
      const ahead = this.curve.getPointAt((this.u + 0.012) % 1);
      const tg = this.curve.getTangentAt(this.u);
      const right = new THREE.Vector3().crossVectors(tg, new THREE.Vector3(0, 1, 0)).normalize();
      const mx = clamp(this.mouse.sx, -1, 1), my = clamp(this.mouse.sy, -1, 1);
      this.camera.position.copy(p).addScaledVector(right, mx * 0.5);
      this.camera.position.y += (1 - intro) * 38;
      // 시선을 살짝 아래로 두어 꽃밭이 화면의 더 많은 부분을 채우게 한다
      const target = ahead.clone().addScaledVector(right, mx * 4).add(new THREE.Vector3(0, my * 2.2 - this.lookDown - (1 - intro) * 20, 0));
      this.camera.lookAt(target);

      // 셰이더 값
      const u = this.uniforms;
      u.uTime.value = this.time; u.uDisperse.value = this.disperse; u.uIntro.value = intro;
      u.uMouse.value.set(this.mouse.sx, this.mouse.sy);

      // 비네트: 빠를수록 조여진다
      const vigTarget = 62 - clamp(this.speed / 30, 0, 1) * 24;
      this.vig += (vigTarget - this.vig) * k(3);
      document.documentElement.style.setProperty('--vig-in', this.vig.toFixed(1));

      if (this._sizeKey() !== this._appliedKey) this._resize();
      this._updateShafts();
      this.renderer.render(this.scene, this.camera);

      if (!this.loadedCalled) { this.loadedCalled = true; requestAnimationFrame(() => this.onLoaded()); }
      if (introT >= 1) this.onIntroDone();   // 도입이 끝난 뒤 매 프레임 (원본과 같은 규칙)
    }
  }

  /* ───────────────────────── 시작하기 ───────────────────────── */
  // 원본 엔진을 쓰는 경우 이 부분만 바꾼다:
  //   const Valley = ...원본 Valley 클래스..., const audioStore = ...원본 오디오 저장소...
  const loader = document.getElementById('loader');
  const ui = document.getElementById('ui');
  const sound = document.getElementById('sound');
  const go = document.getElementById('go');

  let introShown = false;
  const valley = new FlowerValley(
    document.getElementById('valley'),
    () => loader.classList.add('gone'),                                   // onLoaded
    () => { if (!introShown) { introShown = true; ui.classList.add('on'); } }  // onIntroDone
  );
  window.fernhollowValley = valley;   // 개발자 도구에서 살펴볼 수 있게 열어 둔다

  ambient.initAudio();
  sound.onclick = () => {
    if (!ambient.isInitialized) return;
    const muted = ambient.toggleMute();
    sound.setAttribute('aria-pressed', String(!muted));
  };
  // 화살표 위에 올리거나(마우스) 키보드로 이동하면: 비행이 멈추고 꽃이 흩어지고 소리가 먹먹해진다
  go.addEventListener('pointerenter', () => valley.startHoverTransition());
  go.addEventListener('pointerleave', () => valley.stopHoverTransition());
  go.addEventListener('focus', () => valley.startHoverTransition());
  go.addEventListener('blur', () => valley.stopHoverTransition());
})();
</script>
</body>
</html>
